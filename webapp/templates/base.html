<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}XAUUSD Bot{% endblock %} · v{{ app_version }}</title>
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🟡&lt;/text&gt;&lt;/svg&gt;">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="dot">🟡</span>
      <div>
        <div class="title">XAUUSD Bot</div>
        <div class="version">v{{ app_version }} · {{ symbol }}</div>
      </div>
    </div>

    <nav class="nav flex-column">
      <a class="nav-link {% if page == 'dashboard' %}active{% endif %}"
         href="{{ url_for('views.dashboard') }}">📊 Dashboard</a>
      <a class="nav-link {% if page == 'settings' %}active{% endif %}"
         href="{{ url_for('views.settings_page') }}">⚙️ Settings</a>
      <a class="nav-link {% if page == 'backtest' %}active{% endif %}"
         href="{{ url_for('views.backtest_page') }}">🧪 Backtest</a>
      <a class="nav-link {% if page == 'logs' %}active{% endif %}"
         href="{{ url_for('views.logs_page') }}">📜 Logs</a>
    </nav>

    <div class="sidebar-control">
      <div class="status-row">
        <span class="status-badge" id="status-badge">⚪ STOPPED</span>
      </div>
      <div class="d-grid gap-2">
        <button id="btn-start" class="btn btn-success btn-sm">▶ Start</button>
        <button id="btn-stop" class="btn btn-outline-danger btn-sm" disabled>■ Stop</button>
      </div>
      <div class="algo-switch mt-2">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch"
                 id="algo-toggle">
          <label class="form-check-label" for="algo-toggle">
            <span id="algo-toggle-label">Algo enabled</span>
          </label>
        </div>
        <div class="muted small" id="algo-toggle-hint">
          New entries gated. Positions still managed.
        </div>
      </div>
      <div class="mt-2 sidebar-stats">
        <div><span class="label">Equity</span>
             <span class="value" id="stat-equity">—</span></div>
        <div><span class="label">Drawdown</span>
             <span class="value" id="stat-dd">—</span></div>
        <div><span class="label">Active risk</span>
             <span class="value" id="stat-risk">—</span></div>
        <div><span class="label">Last tick</span>
             <span class="value" id="stat-heartbeat">—</span></div>
      </div>
      <div id="error-banner" class="alert alert-danger mt-2 d-none"></div>
    </div>
  </aside>

  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
